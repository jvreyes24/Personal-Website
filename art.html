<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio</title>
    <!--Stylesheets-->
    <link rel="stylesheet" href="style/sitestyle.css">
    <link rel="stylesheet" href="style/pagehead.css">
    <link rel="stylesheet" href="style/art.css">

    <!--Bebas Neue Google Font Embed Code-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="top-bar">
        <a href="index.html" class="home">Jeremy Reyes</a>

        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="uxui.html">Digital Design</a>
            <a href="art.html">Art Portfolio</a>
        </div>
    </header>
    <br>

    <div class="pagecontainer">
        <img class="imghead" src="images/art.jpg">
        <h1 class="giant">Art Portfolio</h1>
    </div>

    <div class="art-gallery">

        <!-- ============================================================ -->
        <!-- ART TILE TEMPLATE                                             -->
        <!-- To add a new piece: copy one .art-tile block, then edit:      -->
        <!--   1. src on .art-image  -> the artwork file                   -->
        <!--   2. alt on .art-image  -> a short description                -->
        <!--   3. .art-caption text  -> the piece's title                  -->
        <!-- Add class="wide" to .art-tile to feature a landscape piece    -->
        <!-- across two columns, as done below for "Dragon".                -->
        <!-- ============================================================ -->

        <figure class="art-tile">
            <img class="art-image" src="images/artportfolio/Hannya_Mask.jpg" alt="Hannya Mask illustration">
            <figcaption class="art-caption">Hannya Mask</figcaption>
        </figure>

        <figure class="art-tile">
            <img class="art-image" src="images/artportfolio/Kaya_Natin_To! 2.jpg" alt="Kaya Natin To! illustration">
            <figcaption class="art-caption">Kaya Natin To!</figcaption>
        </figure>

        <figure class="art-tile">
            <img class="art-image" src="images/artportfolio/Snek.jpg" alt="Snek illustration">
            <figcaption class="art-caption">Snek</figcaption>
        </figure>

        <figure class="art-tile">
            <img class="art-image" src="images/artportfolio/Boo.jpg" alt="Boo illustration">
            <figcaption class="art-caption">Boo</figcaption>
        </figure>

        <figure class="art-tile wide">
            <img class="art-image" src="images/artportfolio/Dragon.jpg" alt="Dragon illustration">
            <figcaption class="art-caption">Dragon</figcaption>
        </figure>

    </div>

    <!-- Lightbox, populated and toggled by JS/art.js -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
        <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>

    <script src="JS/art.js"></script>
</body>
</html>
